name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Pin a caby version (defaults to caby's latest release)
        required: false
  # called by check-caby-version.yml when caby's latest release changes
  workflow_call:
    inputs:
      version:
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # deploys resolve the version here rather than in the build; a pinned
      # input (rollback, or the version check's result) wins over the lookup
      - id: version
        uses: ./.github/actions/caby-version
        with:
          pinned: ${{ inputs.version }}

      - run: pnpm build
        env:
          CABY_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
